services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa}
      POSTGRES_DB: ${POSTGRES_DB:-credit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfa} -d ${POSTGRES_DB:-credit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD:-alfa}@db:5432/${POSTGRES_DB:-credit}
      LLM_URL: ${LLM_URL:-http://llm:8080}
      LLM_MODEL: ${LLM_MODEL:-t-lite-it-2.1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # --- LLM (модель с открытыми весами). Запуск: docker compose --profile llm up ---
  # По умолчанию не запускается и не скачивается. Backend от этого сервиса НЕ зависит
  # (нет depends_on): если LLM нет, ИИ-функции просто отключаются.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server  # TODO перед сдачей зафиксировать тег сборки (server-bNNNN)
    profiles: ["llm"]
    restart: "no"
    environment:
      LLAMA_CACHE: /models
      LLM_HF_REPO: ${LLM_HF_REPO:-t-tech/T-lite-it-2.1-GGUF:Q4_K_M}  # TODO сверить имя файла/кванта в репозитории
    volumes:
      - llmmodels:/models
    # Сначала пробуем кэш без сети (--offline). Если модели в кэше нет, скачиваем с Hugging Face.
    # Нет интернета и нет кэша: контейнер завершается, остальной проект работает без ИИ.
    entrypoint: ["sh", "-c"]
    command:
      - >
        /app/llama-server --host 0.0.0.0 --port 8080 -c 4096 --parallel 1 --offline -hf "$$LLM_HF_REPO"
        || /app/llama-server --host 0.0.0.0 --port 8080 -c 4096 --parallel 1 -hf "$$LLM_HF_REPO"

volumes:
  pgdata:
  llmmodels: